worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    access_log /dev/stdout;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    # Runtime-only budgets; existing auth/image/AI locations do not consume these zones.
    limit_req_zone $binary_remote_addr zone=runtime_ip:1m rate=60r/m;
    limit_req_zone $server_name zone=runtime_total:1m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=runtime_connections:1m;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Repeat in locations with add_header: nginx 1.27 does not merge inheritance.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        set $api_upstream api:3001;
        # Public image-only composition. The common 8080 config stays default-off.
        set $runtime_ingress_enabled 0;
        set $history_ingress_enabled 1;

        location = /api/v1/browser/runtime/imports {
            if ($runtime_ingress_enabled = 0) { return 404; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_encoding != "") { return 400; }
            if ($http_expect != "") { return 400; }
            limit_except POST { deny all; }
            client_max_body_size 64k;
            client_body_buffer_size 64k;
            client_body_timeout 5s;
            limit_req zone=runtime_ip burst=2 nodelay;
            limit_req zone=runtime_total burst=2 nodelay;
            limit_req_status 429;
            limit_conn runtime_connections 2;
            limit_conn_status 429;
            access_log off;
            proxy_request_buffering on;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            # Preserve empty/duplicate incoming auth headers rather than erase them with overrides.
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;
            send_timeout 5s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location ~ "^/api/v1/browser/runtime/(?:consents|consents/[a-f0-9]{32}/revoke|captures/[a-f0-9]{32}/(?:cancel|image-links))$" {
            if ($runtime_ingress_enabled = 0) { return 404; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_encoding != "") { return 400; }
            if ($http_expect != "") { return 400; }
            limit_except POST { deny all; }
            client_max_body_size 1k;
            client_body_buffer_size 1k;
            client_body_timeout 5s;
            limit_req zone=runtime_ip burst=2 nodelay;
            limit_req zone=runtime_total burst=2 nodelay;
            limit_req_status 429;
            limit_conn runtime_connections 2;
            limit_conn_status 429;
            access_log off;
            proxy_request_buffering on;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            # Preserve empty/duplicate incoming auth headers rather than erase them with overrides.
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;
            send_timeout 5s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location = /api/v1/browser/runtime/captures {
            if ($runtime_ingress_enabled = 0) { return 404; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_encoding != "") { return 400; }
            if ($http_expect != "") { return 400; }
            limit_except GET POST { deny all; }
            client_max_body_size 1k;
            client_body_buffer_size 1k;
            client_body_timeout 5s;
            limit_req zone=runtime_ip burst=2 nodelay;
            limit_req zone=runtime_total burst=2 nodelay;
            limit_req_status 429;
            limit_conn runtime_connections 2;
            limit_conn_status 429;
            access_log off;
            proxy_request_buffering on;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            # Preserve empty/duplicate incoming auth headers rather than erase them with overrides.
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;
            send_timeout 5s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        # Events are a finite replay batch, not an unbounded stream or generic child proxy.
        location ~ "^/api/v1/browser/runtime/(?:capabilities|targets|captures/[a-f0-9]{32}(?:/(?:results|events))?)$" {
            if ($runtime_ingress_enabled = 0) { return 404; }
            limit_except GET { deny all; }
            client_max_body_size 1k;
            client_body_timeout 5s;
            limit_req zone=runtime_ip burst=2 nodelay;
            limit_req zone=runtime_total burst=2 nodelay;
            limit_req_status 429;
            limit_conn runtime_connections 2;
            limit_conn_status 429;
            access_log off;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            # Preserve empty/duplicate incoming auth headers rather than erase them with overrides.
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;
            send_timeout 5s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location = /api/v1/browser/runtime { access_log off; return 404; }
        location /api/v1/browser/runtime/ { access_log off; return 404; }

        # Only the cookie-bound browser controller is reachable; JWT-only /api/v1/scans stays private.
        location = /api/v1/browser/scans {
            client_max_body_size 1k;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        # Read-only eligibility uses a bounded POST body and the same cookie/Origin guards.
        location = /api/v1/browser/scans/images/eligibility {
            limit_except POST { deny all; }
            client_max_body_size 1k;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        # Existing durable history/chat, public composition only.
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/chat$" {
            if ($history_ingress_enabled = 0) { return 404; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_encoding != "") { return 400; }
            if ($http_expect != "") { return 400; }
            limit_except POST { deny all; }
            client_max_body_size 8k;
            client_body_buffer_size 8k;
            client_body_timeout 5s;
            access_log off;
            proxy_request_buffering on;
            proxy_pass_request_headers on;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 100s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            send_timeout 5s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/history/decision$" {
            if ($history_ingress_enabled = 0) { return 404; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_encoding != "") { return 400; }
            if ($http_expect != "") { return 400; }
            limit_except POST { deny all; }
            client_max_body_size 8k;
            client_body_buffer_size 8k;
            client_body_timeout 5s;
            access_log off;
            proxy_request_buffering on;
            proxy_pass_request_headers on;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 45s;
            send_timeout 5s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/(?:history|chat/(?:context|usage))$" {
            if ($history_ingress_enabled = 0) { return 404; }
            limit_except GET { deny all; }
            client_max_body_size 1k;
            client_body_timeout 5s;
            access_log off;
            proxy_pass_request_headers on;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 45s;
            send_timeout 5s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        # Public-only selected advisory translation. No generic mutation/proxy route.
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/translation$" {
            if ($request_method != POST) { return 405; }
            if ($is_args != "") { return 400; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_encoding != "") { return 400; }
            if ($http_expect != "") { return 400; }
            client_max_body_size 1k;
            client_body_timeout 2s;
            proxy_request_buffering off;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 100s;
            access_log off;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/translation/context$" {
            if ($request_method != GET) { return 405; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_encoding != "") { return 400; }
            if ($http_expect != "") { return 400; }
            client_max_body_size 1k;
            client_body_timeout 2s;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            access_log off;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/translation/readiness$" {
            if ($request_method != GET) { return 405; }
            if ($is_args != "") { return 400; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_encoding != "") { return 400; }
            if ($http_expect != "") { return 400; }
            client_max_body_size 1k;
            client_body_timeout 2s;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            access_log off;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        # Exact summary route: passive result GET or bounded consent-bound generation POST.
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/summary$" {
            limit_except GET POST { deny all; }
            client_max_body_size 1k;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 100s;
            access_log off;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/(?:context|usage|readiness)$" {
            access_log off;
            limit_except GET { deny all; }
            client_max_body_size 1k;
            client_body_timeout 5s;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        # Cancel is the other exact child mutation; remaining scan children are GET-only.
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/cancel$" {
            limit_except POST { deny all; }
            client_max_body_size 1k;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        # Streaming needs a timeout longer than the 15-second heartbeat and no proxy buffering.
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/events$" {
            limit_except GET { deny all; }
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 35s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location /api/v1/browser/scans/ {
            limit_except GET { deny all; }
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        # Finite auth ingress; Origin and JSON/length validation remain backend authority.
        location = /api/v1/auth/register {
            if ($request_method != POST) { return 405; }
            if ($http_transfer_encoding != "") { return 400; }
            if ($http_content_encoding != "") { return 400; }
            if ($http_expect != "") { return 400; }
            if ($args != "") { return 400; }
            client_max_body_size 1k;
            client_body_buffer_size 1k;
            client_body_timeout 5s;
            access_log off;
            proxy_request_buffering on;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            send_timeout 5s;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
        location = /api/v1/auth/login {
            if ($request_method != POST) { return 405; }
            if ($http_transfer_encoding != "") { return 400; }
