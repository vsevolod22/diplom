worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    access_log /dev/stdout;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        set $api_upstream api:3001;

        # Only the cookie-bound browser controller is reachable; JWT-only /api/v1/scans stays private.
        location = /api/v1/browser/scans {
            client_max_body_size 1k;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
        }
        # Read-only eligibility uses a bounded POST body and the same cookie/Origin guards.
        location = /api/v1/browser/scans/images/eligibility {
            limit_except POST { deny all; }
            client_max_body_size 1k;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
        }
        # Bounded consent-bound LLM summary only, not a generic mutation/proxy route.
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/summary$" {
            limit_except POST { deny all; }
            client_max_body_size 1k;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 35s;
            add_header Cache-Control "no-store" always;
        }
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/llm/context$" {
            limit_except GET { deny all; }
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
        }
        # Cancel is the other exact child mutation; remaining scan children are GET-only.
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/cancel$" {
            limit_except POST { deny all; }
            client_max_body_size 1k;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
        }
        # Streaming needs a timeout longer than the 15-second heartbeat and no proxy buffering.
        location ~ "^/api/v1/browser/scans/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/events$" {
            limit_except GET { deny all; }
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 35s;
            add_header Cache-Control "no-store" always;
        }
        location /api/v1/browser/scans/ {
            limit_except GET { deny all; }
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
        }
        location ^~ /api/v1/auth/ {
            client_max_body_size 1k;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
        }
        location ^~ /api/ { return 404; }
        location = /api { return 404; }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
