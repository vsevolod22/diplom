# Optional local CVE DB overlay. Apply only together with compose.stand.yaml;
# pins and host release directory are supplied by the private stand.env;
# never edit or replace an already published release in place.
services:
  api:
    environment:
      SCAN_VULN_ENABLED: "true"
      SCAN_VULN_RELEASE_DIR: /opt/release
      SCAN_VULN_MANIFEST_DIGEST: ${SCAN_VULN_MANIFEST_DIGEST:?Set reviewed OCI manifest digest}
      SCAN_VULN_ARTIFACT_SHA256: ${SCAN_VULN_ARTIFACT_SHA256:?Set signed bundle SHA256}
    volumes:
      - type: bind
        source: ${SCAN_VULN_RELEASE_HOST_DIR:?Set published absolute release directory}
        target: /opt/release
        read_only: true
        bind: { create_host_path: false }
  worker:
    environment:
      SCAN_VULN_ENABLED: "true"
      SCAN_VULN_RELEASE_DIR: /opt/release
      SCAN_VULN_MANIFEST_DIGEST: ${SCAN_VULN_MANIFEST_DIGEST:?Set reviewed OCI manifest digest}
      SCAN_VULN_ARTIFACT_SHA256: ${SCAN_VULN_ARTIFACT_SHA256:?Set signed bundle SHA256}
    volumes:
      - type: bind
        source: ${SCAN_VULN_RELEASE_HOST_DIR:?Set published absolute release directory}
        target: /opt/release
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SCAN_VULN_RELEASE_HOST_DIR:?Set published absolute release directory}/db
        target: /tmp/trivy/db
        read_only: true
        bind: { create_host_path: false }
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,size=16m
      - /tmp/trivy:rw,noexec,nosuid,uid=65532,gid=65532,size=512m
    mem_limit: 2g
