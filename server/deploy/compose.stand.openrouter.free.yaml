# Fixed opt-in only, after BOTH bases + nginx LOCAL; selector preserves this during refresh.
# Secret file goes to API environment ONLY; never use it as --env-file or print compose config.
services:
  llm-egress:
    build:
      context: ../..
      dockerfile: server/deploy/gateway/openrouter.Dockerfile
    networks: [llm_internal, llm_uplink]
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    cpus: 1
  api:
    env_file:
      - path: ../.env.local
        required: true
    environment:
      # Human approvals remain mandatory/default-off. The key has no interpolation here.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_ROUTING_APPROVED: ${LLM_ROUTING_APPROVED:-false}
      LLM_REGION: ${LLM_REGION:-undecided}
      # Free policy requires explicitly approved no-storage; no-training fails closed.
      LLM_RETENTION: ${LLM_RETENTION:-undecided}
      LLM_POLICY_REVISION: openrouter-free-apodex-v2
      LLM_FREE_ONLY: "true"
      LLM_MODEL: apodex/apodex-1.1-mini:free
      LLM_PROVIDER_ALLOWLIST: novita/bf16
      LLM_REQUEST_BUDGET_USD: "0"
      LLM_INPUT_PRICE_PER_MILLION_USD: "0"
      LLM_OUTPUT_PRICE_PER_MILLION_USD: "0"
      LLM_REQUEST_PRICE_USD: "0"
      LLM_TIMEOUT_MS: "30000"
      LLM_REQUEST_BYTES: "262144"
      LLM_RESPONSE_BYTES: "65536"
      LLM_MAX_FINDINGS: "1000"
      LLM_OUTPUT_TOKENS: "2048"
      # TASK15: same fixed LOCAL selection, API-only /auth volume; never default-on.
      # Caps are intentionally absent until the parent explicitly chooses them.
      LLM_QUOTA_ENABLED: ${LLM_QUOTA_ENABLED:-false}
      LLM_QUOTA_REVISION: ${LLM_QUOTA_REVISION:-undecided}
      LLM_QUOTA_WINDOW: utc-day
      LLM_QUOTA_USER_INPUT: ${LLM_QUOTA_USER_INPUT:-}
      LLM_QUOTA_USER_OUTPUT: ${LLM_QUOTA_USER_OUTPUT:-}
      LLM_QUOTA_USER_COST_USD: ${LLM_QUOTA_USER_COST_USD:-}
      LLM_QUOTA_SCAN_INPUT: ${LLM_QUOTA_SCAN_INPUT:-}
      LLM_QUOTA_SCAN_OUTPUT: ${LLM_QUOTA_SCAN_OUTPUT:-}
      LLM_QUOTA_SCAN_COST_USD: ${LLM_QUOTA_SCAN_COST_USD:-}
      LLM_QUOTA_WARNING_PERCENT: "80"
      LLM_QUOTA_REQUEST_INPUT: "65536"
      LLM_QUOTA_OBSERVATION_TOKENS: "1048576"
      LLM_QUOTA_OBSERVATION_COST_USD: "1"
      LLM_QUOTA_RECEIPT_MS: "300000"
      LLM_QUOTA_REPLAY_DAYS: "7"
      LLM_QUOTA_MAX_ROWS: "100000"
      LLM_QUOTA_DB_BYTES: "67108864"
      LLM_QUOTA_DISK_HEADROOM_BYTES: "134217728"
      LLM_QUOTA_BUSY_MS: "1000"
      LLM_QUOTA_CLEANUP_BATCH: "256"
    networks: [llm_internal]
    depends_on:
      llm-egress: { condition: service_started }
networks:
  llm_internal:
    internal: true
  llm_uplink: {}
